# Sidecar spec for dev.ulduar.Constellar1.xml.
#
#  Source of truth for the Observer `a{sv}` key vocabulary

spec-version: "0.2"
about: >
  Constellar is a D-Bus daemon and set of clients for World of Warcraft. The daemon
  publishes live game state (e.g., the player's current dungeon / raid or in-game location) for
  downstream clients (a Discord presence client, a future video-recording client).

interfaces:
  dev.ulduar.Constellar1.Observer:
    description: >
      Exposes World of Warcraft's current in-game activity and location.

    bags:
      Activity:
        description: The player's current instanced activity. Empty when idle.
        keys:
          - const: kType
            key: type
            type: s
            applies-to: [encounter, dungeon]
            required: true
            stability: stable
            description: >
              Activity kind. A value outside this list must be treated as "unknown".
            enum: [encounter, dungeon, unknown]

          - const: kEncounterId
            key: encounterId
            type: u
            applies-to: [encounter]
            required: true
            stability: stable
            description: Encounter ID (encounter only).

          - const: kEncounterName
            key: encounterName
            type: s
            applies-to: [encounter]
            required: true
            stability: stable
            description: Encounter name (encounter only).

          - const: kDifficulty
            key: difficulty
            type: s
            applies-to: [encounter]
            required: true
            stability: stable
            description: >
              Human-readable difficulty of the zone
            enum: [LFR, Normal, Heroic, Mythic, Unknown]

          - const: kDifficultyId
            key: difficultyId
            type: u
            applies-to: [encounter]
            required: true
            stability: stable
            description: Raw WoW difficultyID (encounter only).

          - const: kZoneId
            key: zoneId
            type: u
            applies-to: [dungeon]
            required: true
            stability: stable
            description: Dungeon instance zone ID (dungeon only).

          - const: kKeystoneLevel
            key: keystoneLevel
            type: u
            applies-to: [dungeon]
            required: true
            stability: stable
            description: Mythic+ keystone level (dungeon only).

          - const: kStartTime
            key: startTime
            type: x
            applies-to: [encounter, dungeon]
            required: true
            stability: stable
            description: Unix epoch milliseconds.

          - const: kChallengeMapId
            key: challengeMapId
            type: u
            applies-to: [dungeon]
            required: true
            stability: stable
            description: Mythic+ challenge-mode map ID (dungeon only).

        ended-additions:
          - const: kOutcome
            key: outcome
            type: s
            applies-to: [encounter, dungeon]
            required: true
            stability: stable
            description: >
              Terminal result of the activity. Encounters report "success",
              "failure", or "abandoned". Dungeons report "success" or "abandoned".
            enum: [unknown, success, failure, abandoned]

          - const: kDurationMs
            key: durationMs
            type: x
            applies-to: [dungeon]
            required: true
            stability: stable
            description: Run duration in milliseconds (dungeon only).

          - const: kStopTime
            key: stopTime
            type: x
            applies-to: [encounter, dungeon]
            required: true
            stability: stable
            description: Unix epoch milliseconds.

      Location:
        description: >
          Where the player is in the world.
        keys:
          - const: kZoneName
            key: zoneName
            type: s
            required: true
            stability: stable
            description: Resolved zone or instance name (e.g., Silvermoon City).

          - const: kZoneCategory
            key: zoneCategory
            type: s
            required: true
            stability: stable
            description: >
              Coarse location kind
            enum: [open-world, dungeon, raid, delve, unknown]

          - const: kUiMapId
            key: uiMapId
            type: u
            required: true
            stability: stable
            description: >
              Stable ID for the player's current map


    methods:
      Pause:
        description: Pause activity detection and recording.
        stability: stable

      Resume:
        description: Resume activity detection and recording.
        stability: stable

      StartManualRecording:
        description: Start a manual recording outside activity detection.
        stability: stable

      StopManualRecording:
        description: Stop a manual recording started with StartManualRecording.
        stability: stable

      ReloadConfig:
        description: Reload the on-disk configuration.
        stability: stable

      ListRecordings:
        description: List recordings, optionally filtered.
        stability: experimental

      DeleteRecording:
        description: Delete a recording by id.
        stability: experimental

      GetConfig:
        description: Fetch the current configuration as an a{sv} bag.
        stability: experimental

      SetConfig:
        description: Replace the current configuration from an a{sv} bag.
        stability: experimental

    signals:
      ActivityEnded:
        description: >
          Fires when an Activity concludes
        stability: stable

      Error:
        description: >
          Reports an asynchronous daemon-side error condition
        stability: experimental

    # D-Bus error vocabulary.
    # Experimental: documented ahead of any emit site.
    errors:
      - code: dev.ulduar.Constellar1.Error.Internal
        stability: experimental
        description: >
          Async Error signal. Generic, unclassified daemon-side failure with no
          outstanding method call (e.g. the combat-log reader died).
      - code: dev.ulduar.Constellar1.Error.RecordingAborted
        stability: experimental
        description: >
          Async Error signal. A recording failed mid-capture, after its start call had
          already returned successfully (e.g. the encoder crashed or the disk filled).
      - code: dev.ulduar.Constellar1.Error.InvalidConfig
        stability: experimental
        description: >
          Method error reply from SetConfig when the supplied configuration bag is
          invalid. Not delivered via the Error signal.
      - code: dev.ulduar.Constellar1.Error.RecordingFailed
        stability: experimental
        description: >
          Method error reply from a recording operation (StartManualRecording /
          StopManualRecording / DeleteRecording) that fails synchronously. Not
          delivered via the Error signal.

  dev.ulduar.Constellar1.Activity:
    description: >
      Base facts common to every activity object (/activity/current,
      /activities/<id>): the same facts as the Observer Activity property bag,
      exposed as a typed object interface instead of an a{sv} bag. An
      encounter or dungeon object additionally composes Activity.Encounter or
      Activity.Dungeon (RFC-006).

    properties:
      Type:
        type: s
        stability: stable
        description: >
          Activity kind. Mirrors the Activity bag's `type` key (kType); a
          value outside this list must be treated as "unknown".
        enum: [encounter, dungeon, unknown]

      StartTime:
        type: x
        stability: stable
        description: Unix epoch milliseconds. Mirrors the Activity bag's `startTime` (kStartTime).

      StopTime:
        type: x
        stability: experimental
        description: >
          Unix epoch milliseconds, set once the activity ends. Mirrors the
          Activity bag's `stopTime` (kStopTime, ActivityEnded-only, already
          stable as a bag key) -- experimental here because the *interface*
          is unbuilt until TASK-009/TASK-010 populate it.

      Outcome:
        type: s
        stability: experimental
        description: >
          Terminal result, set once the activity ends. Mirrors the Activity
          bag's `outcome` (kOutcome, ActivityEnded-only, already stable as a
          bag key) -- experimental here because the *interface* is unbuilt
          until TASK-009/TASK-010 populate it.
        enum: [unknown, success, failure, abandoned]

      Recording:
        type: o
        stability: experimental
        description: >
          The recording (/recordings/<id>) that captured this activity, or
          `/` (the D-Bus no-object sentinel; there is no null `o`) if none
          exists or none has finalized yet. 0..1 -- one activity has at most
          one recording. Blocked until TASK-010's Recording collection
          exists.

  dev.ulduar.Constellar1.Activity.Encounter:
    description: >
      Present only on activity objects of kind "encounter". Mirrors the
      Activity bag's applies-to:[encounter] keys.

    properties:
      EncounterId:
        type: u
        stability: stable
        description: Encounter ID. Mirrors the Activity bag's `encounterId` (kEncounterId).

      EncounterName:
        type: s
        stability: stable
        description: Encounter name. Mirrors the Activity bag's `encounterName` (kEncounterName).

      Difficulty:
        type: s
        stability: stable
        description: >
          Human-readable difficulty of the zone. Mirrors the Activity bag's
          `difficulty` (kDifficulty).
        enum: [LFR, Normal, Heroic, Mythic, Unknown]

      DifficultyId:
        type: u
        stability: stable
        description: Raw WoW difficultyID. Mirrors the Activity bag's `difficultyId` (kDifficultyId).

  dev.ulduar.Constellar1.Activity.Dungeon:
    description: >
      Present only on activity objects of kind "dungeon". Mirrors the
      Activity bag's applies-to:[dungeon] keys.

    properties:
      ZoneId:
        type: u
        stability: stable
        description: Dungeon instance zone ID. Mirrors the Activity bag's `zoneId` (kZoneId).

      KeystoneLevel:
        type: u
        stability: stable
        description: Mythic+ keystone level. Mirrors the Activity bag's `keystoneLevel` (kKeystoneLevel).

      ChallengeMapId:
        type: u
        stability: stable
        description: >
          Mythic+ challenge-mode map ID. Mirrors the Activity bag's
          `challengeMapId` (kChallengeMapId).

      DurationMs:
        type: x
        stability: experimental
        description: >
          Run duration in milliseconds, set once the activity ends. Mirrors
          the Activity bag's `durationMs` (kDurationMs, ActivityEnded-only,
          already stable as a bag key) -- experimental here because the
          *interface* is unbuilt until TASK-009/TASK-010 populate it.

  dev.ulduar.Constellar1.Recording:
    description: >
      A captured video segment ("a library element") at /recordings/<id>.
      Its own object type, independent of Activity -- a recording may span
      several activities or none (manual capture), and finalizes after the
      activity(ies) it captured have already ended (ADR-005). Blocked on
      Phase 2 libobs capture + MetadataStore (TASK-010).

    properties:
      Path:
        type: s
        stability: experimental
        description: Filesystem path of the captured segment.

      State:
        type: s
        stability: experimental
        description: >
          Capture/finalization state. A value outside this list must be
          treated as "unknown".
        enum: [recording, complete, failed, unknown]

      DurationMs:
        type: x
        stability: experimental
        description: Segment duration in milliseconds.

      Activities:
        type: ao
        stability: experimental
        description: >
          The activities this segment captured, possibly empty (`[]` for a
          manual recording with no detected activity). 0..N -- the inverse of
          Activity.Recording.

    methods:
      Delete:
        description: >
          Delete this recording. The daemon repairs any activity whose
          Recording property pointed at this object, flipping it back to `/`.
        stability: experimental

# The object-path tree (RFC-006). Only /Observer is registered today; the rest
# is contract-only until TASK-009 (/activity/current, the ObjectManager root)
# and TASK-010 (/activities/<id>, /recordings/<id>).
objects:
  root: /dev/ulduar/Constellar1
  description: >
    The root object implements the standard org.freedesktop.DBus.ObjectManager
    (GetManagedObjects / InterfacesAdded / InterfacesRemoved). It is a
    freedesktop-standard interface, so it is documented here rather than
    redefined key-by-key as bespoke sidecar vocabulary. GetManagedObjects
    enumerates every descendant object below in one call; InterfacesAdded /
    InterfacesRemoved fire when the current activity starts/ends, an activity
    is archived, or a recording appears/is deleted.
  stability: experimental
  tree:
    - path: /dev/ulduar/Constellar1/Observer
      interfaces: [dev.ulduar.Constellar1.Observer]
      stability: stable
      description: >
        Unchanged by this task: the live level-triggered Activity/Location
        properties, ActivityEnded, Error (ADR-012).

    - path: /dev/ulduar/Constellar1/activity/current
      interfaces:
        - dev.ulduar.Constellar1.Activity
        - dev.ulduar.Constellar1.Activity.Encounter
        - dev.ulduar.Constellar1.Activity.Dungeon
      stability: experimental
      description: >
        The in-progress activity, present only while one exists. Composes the
        base Activity interface plus exactly one of Activity.Encounter /
        Activity.Dungeon depending on kind. Buildable now (TASK-009) from the
        same data source as the Observer Activity property; its Recording
        property is always `/` until TASK-010 lands.

    - path: /dev/ulduar/Constellar1/activities/<id>
      interfaces:
        - dev.ulduar.Constellar1.Activity
        - dev.ulduar.Constellar1.Activity.Encounter
        - dev.ulduar.Constellar1.Activity.Dungeon
      stability: experimental
      description: >
        History: one object per detected activity, recorded or not. Same
        interface composition as /activity/current. Blocked on MetadataStore
        (TASK-010).

    - path: /dev/ulduar/Constellar1/recordings/<id>
      interfaces: [dev.ulduar.Constellar1.Recording]
      stability: experimental
      description: >
        "The Library": one object per captured segment, with or without an
        activity. There is no .Library interface -- enumeration is
        ObjectManager, per-item delete is Recording.Delete(). Blocked on
        Phase 2 libobs capture + MetadataStore (TASK-010).
