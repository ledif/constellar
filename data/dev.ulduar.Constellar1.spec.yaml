# Sidecar spec for dev.ulduar.Constellar1.xml.
#
#  Source of truth for the Observer `a{sv}` key vocabulary

spec-version: "0.2"
about: >
  Constellar is a D-Bus daemon and set of clients for World of Warcraft. The daemon
  publishes live game state (e.g., the player's current dungeon / raid or in-game location) for
  downstream clients (a Discord presence client, a future video-recording client).

interfaces:
  dev.ulduar.Constellar1.Observer:
    description: >
      Exposes World of Warcraft's current in-game activity and location.

    bags:
      Activity:
        description: The player's current instanced activity. Empty when idle.
        keys:
          - const: kType
            key: type
            type: s
            applies-to: [encounter, dungeon]
            required: true
            stability: stable
            description: >
              Activity kind. A value outside this list must be treated as "unknown".
            enum: [encounter, dungeon, unknown]

          - const: kEncounterId
            key: encounterId
            type: u
            applies-to: [encounter]
            required: true
            stability: stable
            description: Encounter ID (encounter only).

          - const: kEncounterName
            key: encounterName
            type: s
            applies-to: [encounter]
            required: true
            stability: stable
            description: Encounter name (encounter only).

          - const: kDifficulty
            key: difficulty
            type: s
            applies-to: [encounter]
            required: true
            stability: stable
            description: >
              Human-readable difficulty of the zone
            enum: [LFR, Normal, Heroic, Mythic, Unknown]

          - const: kDifficultyId
            key: difficultyId
            type: u
            applies-to: [encounter]
            required: true
            stability: stable
            description: Raw WoW difficultyID (encounter only).

          - const: kZoneId
            key: zoneId
            type: u
            applies-to: [dungeon]
            required: true
            stability: stable
            description: Dungeon instance zone ID (dungeon only).

          - const: kKeystoneLevel
            key: keystoneLevel
            type: u
            applies-to: [dungeon]
            required: true
            stability: stable
            description: Mythic+ keystone level (dungeon only).

          - const: kStartTime
            key: startTime
            type: x
            applies-to: [encounter, dungeon]
            required: true
            stability: stable
            description: Unix epoch milliseconds.

          - const: kChallengeMapId
            key: challengeMapId
            type: u
            applies-to: [dungeon]
            required: true
            stability: stable
            description: Mythic+ challenge-mode map ID (dungeon only).

        ended-additions:
          - const: kOutcome
            key: outcome
            type: s
            applies-to: [encounter, dungeon]
            required: true
            stability: stable
            description: >
              Terminal result of the activity. Encounters report "success",
              "failure", or "abandoned". Dungeons report "success" or "abandoned".
            enum: [unknown, success, failure, abandoned]

          - const: kDurationMs
            key: durationMs
            type: x
            applies-to: [encounter, dungeon]
            required: true
            stability: stable
            description: Run duration in milliseconds.

          - const: kStopTime
            key: stopTime
            type: x
            applies-to: [encounter, dungeon]
            required: true
            stability: stable
            description: Unix epoch milliseconds.

      Location:
        description: >
          Where the player is in the world.
        keys:
          - const: kZoneName
            key: zoneName
            type: s
            required: true
            stability: stable
            description: Resolved zone or instance name (e.g., Silvermoon City).

          - const: kZoneCategory
            key: zoneCategory
            type: s
            required: true
            stability: stable
            description: >
              Coarse location kind
            enum: [open-world, dungeon, raid, delve, unknown]

          - const: kUiMapId
            key: uiMapId
            type: u
            required: true
            stability: stable
            description: >
              Stable ID for the player's current map


    methods:
      Pause:
        description: Pause activity detection and recording.
        stability: stable

      Resume:
        description: Resume activity detection and recording.
        stability: stable

      StartManualRecording:
        description: Start a manual recording outside activity detection.
        stability: stable

      StopManualRecording:
        description: Stop a manual recording started with StartManualRecording.
        stability: stable

      ReloadConfig:
        description: Reload the on-disk configuration.
        stability: stable

      ListRecordings:
        description: List recordings, optionally filtered.
        stability: experimental

      DeleteRecording:
        description: Delete a recording by id.
        stability: experimental

      GetConfig:
        description: Fetch the current configuration as an a{sv} bag.
        stability: experimental

      SetConfig:
        description: Replace the current configuration from an a{sv} bag.
        stability: experimental

    signals:
      ActivityEnded:
        description: >
          Fires when an Activity concludes
        stability: stable

      Error:
        description: >
          Reports an asynchronous daemon-side error condition
        stability: experimental

    # D-Bus error vocabulary.
    # Experimental: documented ahead of any emit site.
    errors:
      - code: dev.ulduar.Constellar1.Error.Internal
        stability: experimental
        description: >
          Generic, unclassified asynchronous daemon-side failure.
      - code: dev.ulduar.Constellar1.Error.RecordingAborted
        stability: experimental
        description: >
          A recording failed mid-capture (e.g. the encoder crashed or the disk filled).
      - code: dev.ulduar.Constellar1.Error.RecordingFailed
        stability: experimental
        description: >
          Method error reply from a recording operation (StartManualRecording /
          StopManualRecording / DeleteRecording) that fails synchronously.

  dev.ulduar.Constellar1.Activity:
    description: >
      A keystone dungeon or raid encounter that the player is engaged in.

    properties:
      Type:
        type: s
        stability: stable
        description: >
          Activity kind.
        enum: [encounter, dungeon, unknown]

      StartTime:
        type: x
        stability: stable
        description: Unix epoch milliseconds.

      StopTime:
        type: x
        stability: experimental
        description: >
        description: Unix epoch milliseconds

      Outcome:
        type: s
        stability: experimental
        description: Terminal result after the activity ends
        enum: [success, failure, abandoned, unknown]

      Recording:
        type: o
        stability: experimental
        description: Path of the recording object that captured this activity or
          `/` if none currently exists.

  dev.ulduar.Constellar1.Activity.Encounter:
    description: >
      Present only on activity objects of kind "encounter."

    properties:
      EncounterId:
        type: u
        stability: stable
        description: Encounter ID.

      EncounterName:
        type: s
        stability: stable
        description: Encounter name.

      Difficulty:
        type: s
        stability: stable
        description: >
          Human-readable difficulty of the zone.
        enum: [LFR, Normal, Heroic, Mythic, Unknown]

      DifficultyId:
        type: u
        stability: stable
        description: Raw WoW difficultyID.

  dev.ulduar.Constellar1.Activity.Dungeon:
    description: >
      Present only on activity objects of kind "dungeon."

    properties:
      ZoneId:
        type: u
        stability: stable
        description: Dungeon instance zone ID.

      KeystoneLevel:
        type: u
        stability: stable
        description: Mythic keystone level.

      ChallengeMapId:
        type: u
        stability: stable
        description: >
          Keystone challenge-mode map ID.

      DurationMs:
        type: x
        stability: experimental
        description: Run duration in milliseconds

  dev.ulduar.Constellar1.Recording:
    description: >
      A captured video segment that may span zero or more activities

    properties:
      Path:
        type: s
        stability: experimental
        description: Filesystem path of the captured segment.

      State:
        type: s
        stability: experimental
        description: Capture state.
        enum: [recording, complete, failed, unknown]

      DurationMs:
        type: x
        stability: experimental
        description: Segment duration in milliseconds.

      Activities:
        type: ao
        stability: experimental
        description: >
          The activities this segment captured. Could be empty.

    methods:
      Delete:
        description: Delete this recording.
        stability: experimental

objects:
  root: /dev/ulduar/Constellar1
  description: >
    The root object implements the standard org.freedesktop.DBus.ObjectManager
    that provies GetManagedObjects, InterfacesAdded and InterfacesRemoved.
  stability: experimental
  tree:
    - path: /dev/ulduar/Constellar1/Observer
      interfaces: [dev.ulduar.Constellar1.Observer]
      stability: stable
      description: >
        The singleton observer object

    - path: /dev/ulduar/Constellar1/activity/current
      interfaces:
        - dev.ulduar.Constellar1.Activity
        - dev.ulduar.Constellar1.Activity.Encounter
        - dev.ulduar.Constellar1.Activity.Dungeon
      stability: experimental
      description: >
        The in-progress activity, present only while one exists.

    - path: /dev/ulduar/Constellar1/activities/<id>
      interfaces:
        - dev.ulduar.Constellar1.Activity
        - dev.ulduar.Constellar1.Activity.Encounter
        - dev.ulduar.Constellar1.Activity.Dungeon
      stability: experimental
      status: proposed
      description: >
        A specific historical activity

    - path: /dev/ulduar/Constellar1/recordings/<id>
      interfaces: [dev.ulduar.Constellar1.Recording]
      stability: experimental
      status: proposed
      description: >
        A specific captured recording
