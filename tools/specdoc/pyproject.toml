[project]
name = "specdoc"
version = "0.1.0"
description = "Generator for constellar's D-Bus spec sidecar"
requires-python = ">=3.12"
dependencies = ["pyyaml==6.0.3", "jinja2==3.1.6"]

[project.scripts]
specdoc = "specdoc.generate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["specdoc"]
